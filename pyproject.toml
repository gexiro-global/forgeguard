[build-system]
requires = ["setuptools>=68,<77", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeguard"
version = "0.2.1"
description = "Read-only security posture self-check for self-hosted Gitea and Forgejo."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Gexiro Global Enterprises Ltd"}
]
keywords = ["gitea", "forgejo", "security", "posture", "self-hosted", "cve-2026-27771"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "typer>=0.12,<1"
]

[project.urls]
Homepage = "https://github.com/gexiro-global/forgeguard"
Repository = "https://github.com/gexiro-global/forgeguard"

[project.scripts]
forgeguard = "forgeguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["forgeguard*"]

[tool.setuptools.package-data]
forgeguard = ["py.typed"]
