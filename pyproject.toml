[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeguard"
version = "0.2.2"
description = "Read-only security posture self-check for one authorized self-hosted Gitea instance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Gexiro Global Enterprises Ltd"}
]
keywords = ["gitea", "security", "posture", "self-hosted", "cve-2026-27771"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "typer>=0.12,<1"
]

[project.urls]
Homepage = "https://github.com/gexiro-global/forgeguard"
Repository = "https://github.com/gexiro-global/forgeguard"

[project.scripts]
forgeguard = "forgeguard.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "pytest>=8,<10",
  "ruff>=0.16,<0.17",
  "twine>=6.1,<7",
]

[tool.setuptools.packages.find]
include = ["forgeguard*"]

[tool.setuptools.package-data]
forgeguard = ["py.typed"]
