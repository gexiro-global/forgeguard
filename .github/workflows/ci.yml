name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Compile
        run: python -m compileall forgeguard
      - name: Test
        run: python -m pytest -q --cov=forgeguard --cov-fail-under=91.28
      - name: Check installed dependencies
        run: python -m pip check

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "build==1.6.1" "twine==6.2.0" "jsonschema==4.26.0"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Install exact wheel in clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
      - name: Built-wheel CLI smoke
        run: |
          .wheel-smoke/bin/forgeguard --help
          .wheel-smoke/bin/forgeguard scan --help
          .wheel-smoke/bin/forgeguard checks

      - name: Validate exact distributions outside checkout
        run: python tools/validate_dist.py dist
      - name: Preserve candidate distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  candidate-provenance:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/forgeguard-v0.5-multiforge' || github.ref == 'refs/heads/feat/forgeguard-v0.6-control-plane-hardening')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-dist
          path: dist
      - name: Attest candidate without publishing a release
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*
      - name: Verify exact candidate files and signer workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          mkdir verification
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$EXPECTED_REPO" --signer-workflow "$EXPECTED_REPO/.github/workflows/ci.yml" --format json > "verification/$(basename "$artifact").json"
          done
      - name: Preserve verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-verification
          path: verification/*
          if-no-files-found: error
          retention-days: 5

  qualification-evidence:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/forgeguard-v0.5-multiforge' || github.ref == 'refs/heads/feat/forgeguard-v0.6-control-plane-hardening')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve owner-assembled qualification evidence (hash-bound by the release manifest)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence
          path: qualification/evidence/*
          if-no-files-found: error
          retention-days: 5
