[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeguard"
version = "0.5.0"
description = "Read-only security posture self-check for one authorized self-hosted Gitea or Forgejo instance."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Gexiro Global Enterprises Ltd"}
]
keywords = ["gitea", "security", "posture", "self-hosted", "cve-2026-27771"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "typer>=0.12,<1"
]

[project.urls]
Homepage = "https://gexiro.com/forgeguard"
Repository = "https://github.com/gexiro-global/forgeguard"
Documentation = "https://github.com/gexiro-global/forgeguard/tree/main/docs"
Issues = "https://github.com/gexiro-global/forgeguard/issues"
Changelog = "https://github.com/gexiro-global/forgeguard/blob/main/CHANGELOG.md"

[project.scripts]
forgeguard = "forgeguard.cli:main"

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "twine==6.2.0",
  "pytest-cov==7.1.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
include = ["forgeguard*"]

[tool.setuptools.package-data]
forgeguard = ["py.typed", "schemas/*.json", "schemas/*.md", "advisories/catalog/*.json"]
