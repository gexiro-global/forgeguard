name: publish

# Publish to PyPI via OIDC Trusted Publishing (no API token) with PEP 740 attestations.
# Runs when a GitHub Release is published. Requires a matching Trusted Publisher on PyPI.
# Guards: Python 3.11/3.12 quality gates, tag/version truth, and exact-wheel checks.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Compile
        run: python -m compileall forgeguard
      - name: Test
        run: python -m pytest -q
      - name: Check installed dependencies
        run: python -m pip check

  pypi-publish:
    name: Build and publish
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for Trusted Publishing + signed attestations
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned build toolchain
        run: python -m pip install "build~=1.2" "twine~=6.1"
      - name: Verify release tag matches project version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "project version: $version | release tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag '$tag' does not match project version '$version'"
            exit 1
          fi
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install exact wheel in clean environment
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
      - name: Verify exact-wheel metadata and CLI
        run: |
          .wheel-smoke/bin/python -c "import importlib.metadata as m, tomllib; expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert m.version('forgeguard') == expected"
          .wheel-smoke/bin/forgeguard --help
          .wheel-smoke/bin/forgeguard scan --help
          .wheel-smoke/bin/forgeguard checks
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
